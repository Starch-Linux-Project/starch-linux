# Starch Lite: memory-pressure defaults for Linux Zen and compressed zram swap.
# These are standard Linux VM controls, not Zen-only interfaces.
# Prefer compressing cold anonymous pages over retaining them in RAM.
vm.swappiness = 100
# Zram needs no speculative swap read-ahead.
vm.page-cluster = 0
# Avoid extra free-page reserves caused by fragmentation watermark boosting.
vm.watermark_boost_factor = 0
# Keep the free-page target at 0.1% rather than a larger latency-oriented reserve.
vm.watermark_scale_factor = 10
