efi:
  mountPoint: /boot/efi
  recommendedSize: 512MiB
  minimumSize: 512MiB
  label: EFI
userSwapChoices: [ none ]
initialSwapChoice: none
initialPartitioningChoice: erase
allowManualPartitioning: false
# Erase-only mode is enforced unconditionally in the Starch Calamares package.
defaultPartitionTableType: gpt
defaultFileSystemType: ext4
availableFileSystemTypes: [ ext4 ]
enableLuksAutomatedPartitioning: false
luksGeneration: luks1
lvm:
  enable: false
partitionLayout:
  - name: Starch
    filesystem: ext4
    mountPoint: /
    size: 100%
    minSize: 20G
essentialMounts: [ live-*, control, ventoy ]
