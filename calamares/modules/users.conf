defaultGroups:
  - name: wheel
    must_exist: true
    system: true
sudoersGroup: wheel
sudoersConfigureWithGroup: true
autologinGroup: ""
setRootPassword: false
doAutologin: false
passwordRequirements:
  minLength: 1
allowWeakPasswords: false
allowActiveDirectory: false
user:
  shell: /usr/bin/fish
  forbidden_names: [ root, liveuser ]
  home_permissions: o700
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${login}-starch"
