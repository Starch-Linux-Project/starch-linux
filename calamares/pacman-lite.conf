# Used only when Starch Lite is selected. Artix must precede Arch extra.
[options]
Architecture = auto
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Required
ParallelDownloads = 5

[system]
Server = https://mirrors.dotsrc.org/artix-linux/repos/$repo/os/$arch

[world]
Server = https://mirrors.dotsrc.org/artix-linux/repos/$repo/os/$arch

[galaxy]
Server = https://mirrors.dotsrc.org/artix-linux/repos/$repo/os/$arch

[extra]
# mirrorlist is Arch on the live ISO but Artix in the installed Lite system.
# Use the same explicit Arch servers during bootstrap and after installation.
Server = https://geo.mirror.pkgbuild.com/$repo/os/$arch
Server = https://mirrors.kernel.org/archlinux/$repo/os/$arch
