# Configuration written for Calamares 3.3.14; schemas/examples are CC0-1.0.
modules-search: [ /usr/lib/calamares/modules, local ]
sequence:
  - show: [ welcome, locale, keyboard, partition, users, summary ]
  - exec:
      - starch-preflight
      - partition
      - mount
      - starch-bootstrap
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - displaymanager
      - starch-configure
      - starch-limine
      - starch-validate
      - umount
  - show: [ finished ]
branding: starch
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
