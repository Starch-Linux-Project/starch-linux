#!/usr/bin/nft -f

flush ruleset

table inet starch_filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept
        ct state invalid drop
        ct state { established, related } accept

        # Keep diagnostics, path-MTU discovery, and IPv6 neighbor discovery
        # working. Unsolicited TCP and UDP remain blocked below.
        ip protocol icmp accept
        meta l4proto ipv6-icmp accept

        # Permit address assignment before connection tracking has state.
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
