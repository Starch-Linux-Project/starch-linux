[General]
DisplayServer=wayland

[Wayland]
# Plasma Keyboard is KWin's input method. It remains hidden unless KWin asks
# for it (for example after touch focuses a text field); do not use an
# always-show environment override here.
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1 --inputmethod plasma-keyboard

[X11]
# Do not expose X11 sessions, even if a dependency installs a session file.
SessionDir=/etc/sddm/disabled-xsessions

[Autologin]
User=liveuser
Session=plasma.desktop
Relogin=false

[Theme]
Current=breeze
